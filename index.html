<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뉴스 인사이트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f59e0b'/><text x='16' y='23' font-size='19' font-family='Arial' font-weight='700' text-anchor='middle' fill='%230f2341'>N</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="assets/js/config.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
    <a class="brand" href="#/dashboard">
      <span class="brand-mark">N</span>
      <span class="brand-name" id="brandName">뉴스 인사이트</span>
      <span class="brand-tag" id="brandTag">EDITORIAL INTELLIGENCE</span>
    </a>
    <a class="notice-ticker" id="noticeTicker" href="#/board" hidden></a>
    <div class="status-pill" id="statusPill"><span class="dot"></span><span>불러오는 중…</span></div>
    <div class="user-chip" id="userChip" hidden></div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="nav-label">분석</div>
      <a href="#/dashboard" data-page="dashboard"><i>▦</i>뉴스통계 (N)</a>
      <a href="#/keywords" data-page="keywords"><i>#</i>키워드 랭킹</a>
      <a href="#/media" data-page="media"><i>◫</i>매체 비교</a>
      <a href="#/articles" data-page="articles"><i>≡</i>기사 목록</a>
      <a href="#/insights" data-page="insights"><i>✦</i>작성 인사이트</a>
      <a href="#/reporters" data-page="reporters"><i>✎</i>기자 통계</a>
      <div class="nav-label">소통</div>
      <a href="#/board" data-page="board"><i>✉</i>공지·게시판</a>
      <a href="#/admin" data-page="admin"><i>⚙</i>관리자</a>
      <div class="nav-foot" id="navFoot"></div>
    </nav>

    <main class="main">
      <div id="bannerSlot"></div>
      <section class="filterbar" id="filterbar">
        <div class="presets" id="presets">
          <button data-p="yesterday">어제</button>
          <button data-p="7">7일</button>
          <button data-p="30">30일</button>
          <button data-p="thisMonth">이번 달</button>
          <button data-p="lastMonth">지난 달</button>
          <button data-p="quarter">분기</button>
          <button data-p="year">올해</button>
        </div>
        <div class="dates">
          <input type="date" id="dStart" aria-label="시작일">
          <span>~</span>
          <input type="date" id="dEnd" aria-label="종료일">
          <button class="btn primary" id="btnApply">조회</button>
        </div>
        <div class="filter-actions">
          <button class="btn dl" id="btnReport" title="현재 기간 통계를 엑셀로 저장">보고서 엑셀</button>
        </div>
        <div class="range-note" id="rangeNote"></div>
      </section>
      <div id="view" class="view"></div>
      <footer class="foot" id="foot"></footer>
    </main>
  </div>
  <div id="gate"></div>
  <div class="toast" id="toast" hidden></div>
</body>
</html>
