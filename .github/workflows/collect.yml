name: 뉴스 수집

on:
  # 9월 보충 수집이 끝날 때까지 잠시 멈춤 (끝나면 다시 켬)
  # schedule:
  #   # 30분마다(매시 10분·40분): 오늘 랭킹 조회수 + 오늘 발행목록. 3시간마다(10분 회차) 어제치 재확인·검색어까지 전체 수집
  #   - cron: "10 * * * *"
  #   - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "시작일 YYYY-MM-DD (비우면 어제)"
        required: false
        default: ""
      end:
        description: "종료일 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
      only:
        description: "ranking / publish / counts(전체 매체 발행 건수만) / 비우면 모두"
        required: false
        default: ""
      media:
        description: "매체코드 쉼표구분 (예: 346) / 비우면 설정 전체"
        required: false
        default: ""
      lane:
        description: "급한 보충 수집을 다른 수집과 동시에 돌릴 때 이름 (예: fast) / 비우면 차례대로"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event.inputs.lane && format('collect-{0}', github.event.inputs.lane) || 'collect' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집
        env:
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_ONLY: ${{ github.event.inputs.only }}
          IN_MEDIA: ${{ github.event.inputs.media }}
        run: |
          ARGS=""
          H=$(TZ=Asia/Seoul date +%-H)
          FULL=0; [[ "${{ github.event.schedule }}" == "10 * * * *" && ( $((H % 3)) -eq 0 || $H -lt 3 ) ]] && FULL=1
          if [[ "${{ github.event_name }}" == "schedule" && $FULL -eq 0 ]]; then
            ARGS="--start $(TZ=Asia/Seoul date +%F)"   # 가벼운 30분 수집: 오늘 랭킹 + 오늘 발행목록
            echo "LIGHT=1" >> "$GITHUB_ENV"
          fi
          [[ "$IN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && ARGS="$ARGS --start $IN_START"
          [[ "$IN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && ARGS="$ARGS --end $IN_END"
          [[ "$IN_ONLY" == "ranking" || "$IN_ONLY" == "publish" || "$IN_ONLY" == "counts" ]] && ARGS="$ARGS --only $IN_ONLY"
          [[ "$IN_MEDIA" =~ ^[0-9,]+$ ]] && ARGS="$ARGS --media $IN_MEDIA"
          python collector/collect.py $ARGS

      - name: 검색 키워드 (구글 급상승 + 네이버 검색량)
        if: github.event.inputs.only != 'ranking' && github.event.inputs.only != 'publish' && github.event.inputs.only != 'counts'
        continue-on-error: true
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          if [[ "$LIGHT" == "1" ]]; then python collector/search.py --trends-only; else python collector/search.py; fi

      - name: 저장소에 커밋
        run: |
          git config user.name "news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
