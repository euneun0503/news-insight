name: 뉴스 수집

on:
  schedule:
    # 매시간 10분: 랭킹 조회수 스냅샷(시간대별 조회수용). 3시간마다 발행목록·검색어까지 전체 수집
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "시작일 YYYY-MM-DD (비우면 어제)"
        required: false
        default: ""
      end:
        description: "종료일 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
      only:
        description: "ranking / publish / 비우면 둘 다"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: 수집
        env:
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_ONLY: ${{ github.event.inputs.only }}
          DEBUG_RAW: "1"   # 임시: 기자명 위치 점검용 원본 저장 (점검 후 제거)
        run: |
          ARGS=""
          H=$(TZ=Asia/Seoul date +%-H)
          if [[ "${{ github.event_name }}" == "schedule" && $((H % 3)) -ne 0 && $H -ge 3 ]]; then
            ARGS="--only ranking --start $(TZ=Asia/Seoul date +%F)"   # 가벼운 매시간 수집: 오늘 랭킹만
            echo "LIGHT=1" >> "$GITHUB_ENV"
          fi
          [[ "$IN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && ARGS="$ARGS --start $IN_START"
          [[ "$IN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && ARGS="$ARGS --end $IN_END"
          [[ "$IN_ONLY" == "ranking" || "$IN_ONLY" == "publish" ]] && ARGS="$ARGS --only $IN_ONLY"
          python collector/collect.py $ARGS

      - name: 검색 키워드 (구글 급상승 + 네이버 검색량)
        if: github.event.inputs.only != 'ranking' && github.event.inputs.only != 'publish'
        continue-on-error: true
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          if [[ "$LIGHT" == "1" ]]; then python collector/search.py --trends-only; else python collector/search.py; fi

      - name: 저장소에 커밋
        run: |
          git config user.name "news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
