name: 자동 수집 타이머

# GitHub 예약 실행(schedule)이 이 저장소에서 동작하지 않을 때를 대비한 타이머.
# 한 번 실행하면 약 5시간 40분 동안 매시 10분·40분(KST)에 수집을 실행하고, 끝날 때 자기 자신을 다시 실행해 계속 이어집니다.
# - 매일 07:30 KST: 전체 강제 수집 (어제 확정 + 오늘)
# - 3시간마다(0·3·6…시 10분)와 0~2시: 전체 / 그 외 30분마다: 가벼운 수집(오늘)
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: timer
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 30분마다 수집 실행
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          last=""
          while [ $(date +%s) -lt $end ]; do
            H=$(TZ=Asia/Seoul date +%-H); M=$(TZ=Asia/Seoul date +%-M); key="$H:$M"
            mode=""
            if [[ $H -eq 7 && $M -eq 30 ]]; then mode=full
            elif [[ $M -eq 10 && ( $((H % 3)) -eq 0 || $H -lt 3 ) ]]; then mode=full
            elif [[ $M -eq 10 || $M -eq 40 ]]; then mode=light
            fi
            if [[ -n "$mode" && "$key" != "$last" ]]; then
              echo "$(TZ=Asia/Seoul date '+%F %T') 수집 실행: $mode"
              gh workflow run collect.yml -R "$REPO" -f mode=$mode || echo "실행 요청 실패"
              last="$key"
            fi
            sleep 20
          done
      - name: 다음 타이머 이어서 시작
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run timer.yml -R "${{ github.repository }}"
