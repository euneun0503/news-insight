name: 언론사 목록 갱신

# 네이버 언론사 전체 목록(카테고리별)과 매체별 랭킹·조회수 제공 여부를 조사해 data/media_catalog.json 에 저장
on:
  schedule:
    - cron: "17 20 * * 0"   # 매주 월요일 05:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/catalog.py --check
      - name: 저장소에 커밋
        run: |
          git config user.name "news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media_catalog.json data/cache/catalog_debug.json data/cache/catalog_*.html
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "언론사 목록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
