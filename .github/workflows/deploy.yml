name: 사이트 배포

# 관리자가 공지/배너를 저장하거나 코드를 고치면(= main에 push) 사이트를 다시 배포합니다.
# (자동 수집은 collect.yml 안에서 직접 배포합니다)
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/logs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 새 버전이 바로 보이도록 (브라우저 캐시 무효화)
        run: |
          V=${GITHUB_SHA::7}-$(date +%s)
          sed -i -E "s#(from \"\./[a-z]+\.js)\"#\1?v=$V\"#g" assets/js/*.js
          sed -i -E "s#assets/js/main\.js\"#assets/js/main.js?v=$V\"#; s#assets/css/style\.css\"#assets/css/style.css?v=$V\"#" index.html
          grep -c "?v=$V" index.html assets/js/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
