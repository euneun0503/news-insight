name: 기자 이메일 과거 채우기

# 이미 수집한 기사 페이지를 다시 열어 바이라인의 기자 이메일을 모읍니다 (암호화 저장, 마스터만 열람).
# 관리자 화면에서 마스터가 '기자 메일 암호화 설정'을 먼저 해야 저장됩니다.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "우리 매체 발행 기사 시작일 YYYY-MM-DD"
        required: true
        default: "2026-09-01"
      end:
        description: "종료일 YYYY-MM-DD (비우면 어제)"
        required: false
        default: ""
      ranking_days:
        description: "전 매체 랭킹 기사: 종료일 기준 최근 며칠"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: contacts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - name: 기자 이메일 모으기
        run: |
          END="${{ github.event.inputs.end }}"; [ -z "$END" ] && END=$(TZ=Asia/Seoul date -d yesterday +%F)
          python collector/contacts_backfill.py "${{ github.event.inputs.start }}" "$END" "${{ github.event.inputs.ranking_days }}"
      - name: 저장소에 커밋
        run: |
          git config user.name "news-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contacts || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기자 이메일(암호화) $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
