<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뉴스 인사이트 미리보기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23f59e0b'/><text x='16' y='23' font-size='19' font-family='Arial' font-weight='700' text-anchor='middle' fill='%230f2341'>N</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>:root {
  --navy: #0f2341;
  --navy-2: #18335c;
  --bg: #f4f6fa;
  --card: #ffffff;
  --line: #e3e8f0;
  --line-2: #eef1f6;
  --text: #16202f;
  --text-2: #4a5568;
  --muted: #8592a6;
  --blue: #2563eb;
  --blue-soft: #e8f0fe;
  --orange: #f97316;
  --orange-soft: #fff1e6;
  --green: #0f9d74;
  --red: #dc2626;
  --amber: #f59e0b;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 32, 60, .04), 0 2px 8px rgba(16, 32, 60, .04);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }

/* ── 상단바 ───────────────────────── */
.topbar { position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--navy); color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--amber); color: var(--navy); display: grid; place-items: center; font-weight: 800; }
.brand-name { font-weight: 700; font-size: 17px; }
.brand-tag { font-size: 10.5px; letter-spacing: .08em; opacity: .65; }
.menu-btn { display: none; background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; }
.notice-ticker { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; color: #dbe6f6; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.notice-ticker b { background: var(--amber); color: var(--navy); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
.notice-ticker:hover { color: #fff; text-decoration: none; }
.status-pill { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #cfd9e8; white-space: nowrap; }
.status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
.status-pill.ok .dot { background: #22c55e; }
.status-pill.warn .dot { background: var(--amber); }
.status-pill.bad .dot { background: var(--red); }

/* ── 레이아웃 ────────────────────── */
.layout { display: flex; min-height: calc(100vh - 56px); background: linear-gradient(90deg, #fff 212px, var(--bg) 212px); }
.sidebar { width: 212px; flex-shrink: 0; padding: 18px 12px; background: #fff; border-right: 1px solid var(--line); position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 2px 0; border-radius: 8px; color: var(--text-2); font-weight: 500; }
.sidebar a i { width: 18px; text-align: center; font-style: normal; color: var(--muted); }
.sidebar a:hover { background: var(--line-2); text-decoration: none; }
.sidebar a.active { background: var(--blue-soft); color: var(--blue); font-weight: 650; }
.sidebar a.active i { color: var(--blue); }
.nav-label { font-size: 11.5px; color: var(--muted); padding: 14px 12px 4px; letter-spacing: .04em; }
.nav-foot { margin-top: 18px; padding: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.6; }
.main { flex: 1; min-width: 0; padding: 20px 24px 40px; max-width: 1440px; }
.view { display: flex; flex-direction: column; gap: 16px; }

/* ── 기간 필터 ───────────────────── */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 16px; box-shadow: var(--shadow); }
.filterbar[hidden] { display: none; }
.presets { display: flex; background: var(--line-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.presets button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-size: 13px; }
.presets button:hover { background: #fff; }
.presets button.on { background: #fff; color: var(--blue); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.dates { display: flex; align-items: center; gap: 6px; }
.dates input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; }
.filter-actions { margin-left: auto; display: flex; gap: 6px; }
.range-note { width: 100%; font-size: 12px; color: var(--muted); }
.range-note:empty { display: none; }
.range-note .warn { color: #b45309; }

/* ── 공통 요소 ───────────────────── */
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 550; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: #c7d0dd; background: #fafbfd; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: #1d4fd8; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 750; }
.page-head p { margin: 4px 0 0; color: var(--text-2); font-size: 13.5px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.card-head h3 { font-size: 15.5px; font-weight: 700; }
.card-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-head .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }

.kpi .label { font-size: 13px; color: var(--text-2); font-weight: 550; }
.kpi .value { font-size: 28px; font-weight: 750; margin: 6px 0 2px; letter-spacing: -.02em; }
.kpi .meta { font-size: 12px; color: var(--muted); }
.kpi .value.blue { color: var(--blue); }
.kpi .value.orange { color: var(--orange); }
.kpi .value.green { color: var(--green); }
.delta { font-size: 12px; font-weight: 650; margin-left: 4px; }
.delta.up { color: var(--red); }
.delta.down { color: var(--blue); }

.seg { display: inline-flex; background: var(--line-2); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.seg button.on { background: #fff; color: var(--text); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.input, select.input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; min-width: 0; }
.input:focus, .dates input:focus, textarea:focus { outline: 2px solid #bfd3fb; border-color: var(--blue); }

.chart-box { position: relative; height: 280px; }
.chart-box.sm { height: 200px; }
.chart-box.lg { height: 340px; }

.empty { padding: 36px 12px; text-align: center; color: var(--muted); font-size: 13px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.loading::before { content: ""; display: block; width: 26px; height: 26px; margin: 0 auto 10px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 표 ─────────────────────────── */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 8px; border-bottom: 1px solid var(--line); background: #fafbfd; white-space: nowrap; position: sticky; top: 0; }
table.t th.r, table.t td.r { text-align: right; }
table.t th.c, table.t td.c { text-align: center; }
table.t th.sortable { cursor: pointer; }
table.t th.sortable:hover { color: var(--text); }
table.t th.sorted::after { content: " ▾"; }
table.t td { padding: 9px 8px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.t tr:hover td { background: #fafcff; }
table.t tr.ours td { background: var(--orange-soft); }
table.t td.title { min-width: 280px; }
table.t td.title a { color: var(--text); }
table.t td.title a:hover { color: var(--blue); }
.rank-badge { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 5px; border-radius: 6px; background: var(--line-2); font-weight: 700; font-size: 12px; }
.rank-badge.top { background: var(--navy); color: #fff; }
.media-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.media-chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--line-2); color: var(--text-2); }
.tag.new { background: #fee2e2; color: var(--red); }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.tag.orange { background: var(--orange-soft); color: #c2410c; }
.tag.green { background: #dcfce7; color: #15803d; }
.tag.gray { background: #eef1f6; color: var(--muted); }
.bar { position: relative; height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 4px; }
.bar.orange > span { background: var(--orange); }

.pager { display: flex; align-items: center; justify-content: center; gap: 6px; padding-top: 12px; font-size: 13px; color: var(--text-2); }

/* ── 키워드 ─────────────────────── */
.kw-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.kw-cloud a { padding: 4px 10px; border-radius: 999px; background: var(--line-2); color: var(--text); font-size: 13px; }
.kw-cloud a:hover { background: var(--blue-soft); color: var(--blue); text-decoration: none; }
.kw-list { display: flex; flex-direction: column; gap: 2px; }
.kw-row { display: grid; grid-template-columns: 24px minmax(70px, 1fr) 2fr 70px; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
.kw-row:hover { background: #f6f8fc; }
.kw-row .n { color: var(--muted); font-weight: 650; font-size: 12px; text-align: right; }
.kw-row .w { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kw-row .v { text-align: right; font-size: 12.5px; color: var(--text-2); }
.kw-detail { border: 1px solid #c9d8f6; background: #fbfdff; }
.spark { display: block; }

/* ── 히트맵 ─────────────────────── */
.heat { display: grid; gap: 2px; font-size: 11px; }
.heat .hl { color: var(--text-2); padding-right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; }
.heat .hc { height: 22px; border-radius: 3px; display: grid; place-items: center; color: transparent; }
.heat .hc:hover { color: #000; outline: 1px solid var(--navy); }
.heat .hh { text-align: center; color: var(--muted); font-size: 10.5px; }

/* ── 인사이트 ───────────────────── */
.insight-list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.insight-list li { display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: #f8fafd; border: 1px solid var(--line-2); }
.insight-list li b { color: var(--navy); }
.insight-list li .ico { font-size: 18px; line-height: 1.2; }
.pattern-row { display: grid; grid-template-columns: 130px 1fr 80px 90px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.pattern-row:last-child { border-bottom: 0; }

/* ── 배너/공지/게시판 ────────────── */
.banner-wrap { position: relative; margin-bottom: 16px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.banner { display: flex; align-items: center; gap: 18px; min-height: 92px; padding: 18px 24px; color: #fff; background: var(--navy-2); background-size: cover; background-position: center; text-decoration: none; position: relative; }
.banner:hover { text-decoration: none; filter: brightness(1.04); }
.banner.has-img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 22, 42, .78) 0%, rgba(10, 22, 42, .35) 60%, rgba(10, 22, 42, .1) 100%); }
.banner > * { position: relative; }
.banner .b-kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; opacity: .85; }
.banner .b-title { font-size: 19px; font-weight: 750; margin-top: 2px; }
.banner .b-sum { font-size: 13px; opacity: .9; margin-top: 2px; }
.banner .b-go { margin-left: auto; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; white-space: nowrap; }
.banner-dots { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 6px; }
.banner-dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; background: rgba(255,255,255,.45); cursor: pointer; padding: 0; }
.banner-dots button.on { background: #fff; width: 18px; border-radius: 4px; }
.banner-close { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,.25); color: #fff; border: 0; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; z-index: 2; }

.notice-list { display: flex; flex-direction: column; }
.notice-list a { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line-2); color: var(--text); }
.notice-list a:last-child { border-bottom: 0; }
.notice-list a:hover { color: var(--blue); text-decoration: none; }
.notice-list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice-list .d { font-size: 12px; color: var(--muted); white-space: nowrap; }

.board-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.board-tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
.board-tabs button.on { color: var(--blue); border-bottom-color: var(--blue); }
.post-view { max-width: 860px; }
.post-view .post-meta { color: var(--muted); font-size: 12.5px; margin: 8px 0 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.post-view h1 { font-size: 24px; font-weight: 750; line-height: 1.35; }
.post-body { font-size: 15px; line-height: 1.8; color: #263244; word-break: keep-all; overflow-wrap: anywhere; }
.post-body img { max-width: 100%; border-radius: 10px; }
.post-body h2 { font-size: 18px; margin: 22px 0 8px; }
.post-body h3 { font-size: 16px; margin: 18px 0 6px; }
.post-body p { margin: 0 0 12px; }
.post-body ul, .post-body ol { padding-left: 22px; margin: 0 0 12px; }
.post-body blockquote { margin: 0 0 12px; padding: 8px 14px; border-left: 3px solid var(--line); color: var(--text-2); background: #fafbfd; }
.post-hero { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 18px; }

/* ── 관리자 ─────────────────────── */
.form-grid { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px 14px; align-items: center; }
.form-grid label { font-weight: 600; font-size: 13px; color: var(--text-2); }
.form-grid .full { grid-column: 1 / -1; }
.form-grid textarea { min-height: 260px; resize: vertical; font-family: var(--font); line-height: 1.6; }
.form-grid .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.form-hint { font-size: 12px; color: var(--muted); }
.img-preview { max-width: 280px; max-height: 120px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.admin-login { max-width: 520px; }
.admin-login ol { padding-left: 18px; color: var(--text-2); line-height: 1.8; font-size: 13px; }
.status-line { font-size: 12.5px; color: var(--text-2); }
.err-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.ok-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--line-2); padding: 1px 5px; border-radius: 4px; }

.foot { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.7; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

/* ── 반응형 ─────────────────────── */
@media (max-width: 1180px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-21, .g-12, .g-3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .layout { background: var(--bg); }
  .menu-btn { display: block; }
  .brand-tag, .status-pill span:last-child { display: none; }
  .sidebar { position: fixed; left: 0; top: 56px; z-index: 25; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.08); }
  .sidebar.open { transform: none; }
  .main { padding: 14px 16px 30px; }
  .g-2 { grid-template-columns: minmax(0, 1fr); }
  .filter-actions { margin-left: 0; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .pattern-row { grid-template-columns: 100px 1fr 60px; }
  .pattern-row > :last-child { display: none; }
}
@media (max-width: 520px) {
  .g-4 { grid-template-columns: minmax(0, 1fr); }
  .notice-ticker { display: none !important; }
}

/* ── ⓘ 자료 출처 ───────────────── */
.info-btn { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 5px; padding: 0; vertical-align: 1px; border-radius: 50%; border: 1.3px solid #9aa6b8; background: #fff; color: #6b778a; font: italic 700 11px/1 Georgia, "Times New Roman", serif; cursor: pointer; flex-shrink: 0; }
.info-btn:hover, .info-btn:focus-visible { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); outline: none; }
h1 .info-btn { width: 19px; height: 19px; font-size: 12px; vertical-align: 3px; }
.info-pop { position: absolute; z-index: 60; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(15, 35, 65, .18); padding: 14px 16px; font-size: 12.5px; line-height: 1.6; color: var(--text-2); max-height: 70vh; overflow-y: auto; }
.info-pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 14px; color: var(--text); }
.info-close { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; }
.info-sec { margin-top: 10px; }
.info-lab { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--blue); margin-bottom: 3px; }
.info-sec ul { margin: 0; padding-left: 16px; }
.info-sec li { margin: 3px 0; }
.info-sec li div { color: var(--muted); font-size: 12px; }
.info-sec p { margin: 0; }
.info-notes li { color: #92400e; }
.info-foot { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line-2); font-size: 11.5px; color: var(--muted); }

.page-head p.cov-line { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.card-head > a { white-space: nowrap; flex-shrink: 0; }
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
